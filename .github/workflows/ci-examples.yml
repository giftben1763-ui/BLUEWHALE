name: ci-examples

on:
  push:
    branches: [main]
    paths:
      - "examples/go-payment-listener/**"
      - "packages/core-go/**"
      - "examples/django-anchor-router/**"
      - "examples/python-compliance-logger/**"
      - ".github/workflows/ci-examples.yml"
  pull_request:
    paths:
      - "examples/go-payment-listener/**"
      - "packages/core-go/**"
      - "examples/django-anchor-router/**"
      - "examples/python-compliance-logger/**"
      - ".github/workflows/ci-examples.yml"

jobs:
  go-payment-listener:
    name: go-payment-listener (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/go-payment-listener
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/go-payment-listener/go.mod
          cache-dependency-path: examples/go-payment-listener/go.sum
      # go.mod replaces core-go with ../../packages/core-go, so this always
      # compiles against the latest core-go in the repo.
      - run: go mod verify
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  django-anchor-router:
    name: django-anchor-router (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: examples/django-anchor-router
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: examples/django-anchor-router/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test -v 2

  python-compliance-logger:
    name: python-compliance-logger (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: examples/python-compliance-logger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: ./run_tests.sh
