name: verify-parity

# Enforces behavioral parity of the shared test vectors across core-ts,
# core-go, and core-dart. Triggered on every pull_request that touches any
# of the three SDK packages or the spec/ directory, ensuring that no
# implementation diverges from the canonical vector suite regardless of
# which package is modified.
#
# Previously this workflow only ran when spec/vectors.json changed (Issue #75).
# It now fires on any PR touching:
#   - packages/core-ts/**
#   - packages/core-go/**
#   - packages/core-dart/**
#   - spec/**
#
# Minimum GITHUB_TOKEN scope: read-only. No deployments, no secret access.
permissions:
  contents: read

on:
  pull_request:
    paths:
      - "packages/core-ts/**"
      - "packages/core-go/**"
      - "packages/core-dart/**"
      - "spec/**"

# Cancel superseded runs when a PR is pushed to repeatedly while a check is
# still in flight, saving CI minutes on rapid iteration.
concurrency:
  group: verify-parity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-ts:
    name: core-ts parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm --filter @redishfish/bluewhale-core test

  test-go:
    name: core-go parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: cd packages/core-go && go test ./...

  test-dart:
    name: core-dart parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - id: setup-chrome
        uses: browser-actions/setup-chrome@v1
      - run: cd packages/core-dart && dart pub get
      - run: cd packages/core-dart && dart test
      - run: cd packages/core-dart && dart test test/web_compat --platform chrome
        env:
          CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}

  parity-gate:
    name: parity gate
    runs-on: ubuntu-latest
    needs: [test-ts, test-go, test-dart]
    if: always()
    steps:
      - name: Enforce parity across TS, Go, and Dart
        if: needs.test-ts.result != 'success' || needs.test-go.result != 'success' || needs.test-dart.result != 'success'
        run: |
          echo "::error::Parity check failed: at least one implementation diverged from the spec."
          echo "::error::core-ts:   ${{ needs.test-ts.result }}"
          echo "::error::core-go:   ${{ needs.test-go.result }}"
          echo "::error::core-dart: ${{ needs.test-dart.result }}"
          exit 1
